hugoblox:
  schema: "2.0"
  identity:
    name: "Robel Gebre"
    type: person
    tagline: Assistant Professor of Radiology
    description: "Neuroimaging biomarkers, tau PET, and machine learning for Alzheimer's disease and neurodegeneration. Research by Robel Gebre, Mayo Clinic."
  theme:
    mode: light
    pack:
      light: retro
      dark: coffee
    colors:
      primary: "#4D6B61"
      secondary: "#906534"
    colors_dark:
      primary: "#A5BEAA"
      secondary: "#D6B16F"
  typography:
    pack: developer
    families:
      nav: IBM Plex Sans
    size: md
  layout:
    radius: sm
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
