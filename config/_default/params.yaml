hugoblox:
  schema: "2.0"
  identity:
    name: "Robel Gebre"
    type: person
    tagline: Assistant Professor of Radiology
    description: "Neuroimaging biomarkers, tau PET, and machine learning for Alzheimer's disease and neurodegeneration. Research by Robel Gebre, Mayo Clinic."
  theme:
    mode: dark
    pack:
      light: retro
      dark: coffee
    colors:
      primary: "#4D6B61"
      secondary: "#906534"
    colors_dark:
      primary: "#A5BEAA"
      secondary: "#D6B16F"
  typography:
    pack: developer
    families:
      heading: Pixelify Sans
      body: Arial
      nav: Pixelify Sans
    weights:
      heading: [400, 500, 600, 700]
      body: [400, 500, 600, 700]
    variable:
      heading: false
      body: false
    leading:
      heading: 1.2
      body: 1.75
    tracking:
      heading: "0.01em"
      body: "0.01em"
    size: md
  layout:
    radius: sm
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true

site_metrics:
  # Optional URL-prefix Search Console verification token; domain properties use DNS instead.
  search_console_verification: ""
  # Optional GA4 measurement ID, such as G-XXXXXXXXXX.
  ga4_measurement_id: ""
