<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  html body {
    font-family: Arial, Helvetica, sans-serif;
  }

  html body :is(h1, h2, h3, h4, h5, h6, nav) {
    font-family: "Pixelify Sans", system-ui, sans-serif !important;
  }

  html body :is(.prose, input, textarea, select, button) {
    font-family: Arial, Helvetica, sans-serif;
  }

  #site-header .navbar-brand img {
    width: 1.4em;
    height: 1.4em;
    vertical-align: middle;
    object-fit: contain;
  }

  /* The biography block renders the name and landing headings as divs. */
  #section-resume-biography #profile > .text-3xl,
  #research > .flex > .mb-6,
  #papers > .flex > .mb-6,
  #section-collection > .flex > .mb-6,
  #talks > .flex > .mb-6,
  #blog > .flex > .mb-6 {
    font-family: "Pixelify Sans", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }

  #section-resume-biography #profile > .prose {
    max-width: 38rem;
  }

  /* A small accent repeats the introduction's gold rule. */
  :is(#research, #papers, #section-collection, #talks, #blog) > .flex > .mb-6::after {
    content: "";
    display: block;
    width: 2rem;
    height: 2px;
    margin: 0.8rem auto 0;
    background: #906534;
    opacity: 0.7;
  }

  html.dark :is(#research, #papers, #section-collection, #talks, #blog) > .flex > .mb-6::after {
    background: #d6b16f;
  }

  .pub-list-item.view-citation {
    padding-block: 0.35rem 0.75rem;
    line-height: 1.75;
    color: #5c625f;
  }

  html.dark .pub-list-item.view-citation {
    color: #b5bcb7;
  }

  .pub-list-item .li-cite-author {
    font-size: 0.9em;
  }

  .pub-list-item.view-citation > a {
    font-weight: 600;
    color: #263d34;
    text-decoration-color: rgb(77 107 97 / 0.35);
    text-underline-offset: 0.2em;
  }

  html.dark .pub-list-item.view-citation > a {
    color: #e2e9e4;
    text-decoration-color: rgb(165 190 170 / 0.4);
  }

  #papers [role="article"] h3 {
    line-height: 1.4;
  }

  html body :is(main, nav) a {
    transition: color 150ms ease, text-decoration-color 150ms ease;
    text-underline-offset: 0.2em;
  }

  html body main :is(.prose a, .pub-list-item > a, h3 a):is(:hover, :focus-visible) {
    text-decoration-line: underline;
    text-decoration-color: currentColor;
  }

  #section-resume-biography #profile .bio-text {
    font-size: 1.125rem;
    line-height: 1.65;
  }

  #section-resume-biography {
    border-bottom: 1px solid rgb(77 107 97 / 0.18);
  }

  html:not(.dark) #section-resume-biography {
    background: radial-gradient(circle at 18% 32%, rgb(201 183 151 / 0.2), transparent 44%), #f6f0e5;
  }

  {{ if .IsHome }}
  html.dark body,
  html.dark header,
  html.dark nav,
  html.dark main,
  html.dark main > *,
  html.dark footer,
  html.dark #section-resume-biography,
  html.dark #research,
  html.dark #papers,
  html.dark #section-collection,
  html.dark #talks,
  html.dark #blog {
    background: #000 !important;
    background-image: none !important;
  }

  html.dark :is(#papers, #section-collection, #talks, #blog) :is(article, [role="article"]) {
    background: #000 !important;
    background-image: none !important;
  }
  {{ end }}

  html:not(.dark) #papers [role="article"] {
    background: #fffbf4;
    border: 1px solid rgb(112 91 67 / 0.18);
    border-radius: 0.5rem;
    box-shadow: 0 2px 10px rgb(63 48 34 / 0.04);
  }

  html.dark #papers [role="article"] {
    background: #000;
    border: 1px solid rgb(214 177 111 / 0.18);
    border-radius: 0.5rem;
    box-shadow: none;
  }

  #papers [role="article"] {
    transition: border-color 150ms ease;
  }

  #papers [role="article"]:hover {
    transform: none;
    translate: none;
    border-color: rgb(144 101 52 / 0.4);
  }

  html.dark #papers [role="article"]:hover {
    border-color: rgb(214 177 111 / 0.4);
  }

  #papers [role="article"]:hover img {
    transform: none;
    scale: none;
  }

  @media (prefers-reduced-motion: reduce) {
    html body :is(main, nav) a,
    #papers [role="article"],
    #papers [role="article"] img {
      transition: none;
    }
  }

  footer .personal-mark {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 auto 0.75rem;
  }

  footer .personal-mark img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #section-resume-biography .avatar-emoji {
    width: 52px;
    height: 52px;
    right: -6px;
    bottom: -6px;
    overflow: hidden;
    color: transparent;
    font-size: 0;
    line-height: 0;
    background: #f6f0e5 url('{{ "uploads/personal-mark.png" | relURL }}') center / 135% no-repeat;
    border: 1px solid rgb(77 107 97 / 0.55);
    box-shadow: 0 0 0 3px #f6f0e5;
  }

  html.dark #section-resume-biography .avatar-emoji {
    background-color: #000;
    border-color: rgb(165 190 170 / 0.65);
    box-shadow: 0 0 0 3px #000;
  }

  @media (min-width: 960px) {
    #section-resume-biography #profile {
      display: block;
      position: relative;
      max-width: 68rem;
      margin-inline: auto;
      padding: 2rem 2rem 2rem clamp(18rem, 31vw, 24rem);
      text-align: left;
    }

    #section-resume-biography #profile > .avatar-wrapper {
      position: absolute;
      left: clamp(2rem, 6vw, 5rem);
      top: 50%;
      transform: translateY(-50%);
      margin-top: 0;
      outline: 1px solid rgb(77 107 97 / 0.55);
      outline-offset: 14px;
      border-radius: 50%;
    }

    html.dark #section-resume-biography #profile > .avatar-wrapper {
      outline-color: rgb(165 190 170 / 0.65);
    }

    #section-resume-biography #profile > .text-3xl {
      margin: 0 0 0.5rem;
      font-size: clamp(2.6rem, 4vw, 4rem);
      line-height: 1.2;
    }

    #section-resume-biography #profile > .network-icon {
      display: flex;
      justify-content: flex-start;
    }

    #section-resume-biography #profile > .prose {
      margin-top: 1.5rem;
      border-left: 3px solid #906534;
      padding-left: 1.25rem;
    }

    #section-resume-biography #profile .bio-text {
      font-size: 1.375rem;
      line-height: 1.55;
    }

    html.dark #section-resume-biography #profile > .prose {
      border-left-color: #d6b16f;
    }

    #section-resume-biography #profile > a {
      margin-top: 1.5rem;
    }
  }
</style>
